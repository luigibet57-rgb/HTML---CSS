<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de desafio</title>
    <style>
       body {
            font-family: Arial, Helvetica, sans-serif;
        }

        thead {
            background-color: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }
        th {
            background-color: rgb(102, 96, 96);
            border: 1px solid rgb(0, 0, 0);
            text-align: center;
            color:  white;
        }

        td {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        

    </style>
</head>
<body>
    <h1>Notas</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Area</th>
                <th rowspan="2" scope="colgroup">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="colgroup">Media</th>
                <tr>
                    <th>Nota1</th>
                    <th>Nota2</th>
                </tr>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matematica</td>
                <td>8.0</td>
                <td>9.0</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>9.0</td>
                <td>10.0</td>
                <td>0.0</td>
            </tr>
           <tr>
                <td>Biologia</td>
                <td>6.0</td>
                <td>7.0</td>
                <td>6.5</td>
            </tr>
        </tbody>
        <tr>    
            <th colspan="4" scope="row">Media geral de Exatas</th>
            <td>5.0</td>
        </tr>
        <tbody>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>Historia</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>6.0</td>
                <td>7.0</td>
                <td>6.5</td>
            </tr>
        </tbody>
        <tr>
            <th colspan="4" scope="row">Media geral de Humanas</th>
            <td>5.0</td>
        </tr>
        
    </table>
</body>
</html>
